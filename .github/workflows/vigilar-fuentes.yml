name: Vigilar fuentes de skills

# Cada lunes (07:00 en Colombia) sincroniza el catálogo contra GitHub, guarda el
# catálogo actualizado en datos/ y abre un issue si hay skills nuevas, cambiadas
# o retiradas. También se puede lanzar a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: vigilar-fuentes
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sincronizar catálogo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKILLHUB_HOME: ${{ github.workspace }}/datos
        run: python skillhub.py sync --modo auto --informe informe.md

      - name: Guardar catálogo actualizado
        run: |
          git config user.name "skillhub-bot"
          git config user.email "skillhub-bot@users.noreply.github.com"
          git add datos/catalog.json datos/fuentes.json datos/perfiles.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el catálogo."
          else
            git commit -m "Actualiza el catálogo de skills"
            git push
          fi

      - name: Abrir issue si hay cambios o errores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -qE '^- (Nuevas|Modificadas|Retiradas|Error)' informe.md; then
            gh issue create --title "Cambios en las fuentes de skills ($(date -u +%F))" --body-file informe.md
          else
            echo "Nada que reportar."
          fi

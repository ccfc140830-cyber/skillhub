<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillHub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#ffffff; --band:#eeeeee; --card:#ffffff; --ink:#333333; --ink2:#666666; --title:#00607c; --line:#cccccc; --focus:#003848;
  --petroleo:#00607c; --abismo:#003848; --turquesa:#2ea5b0; --lago:#3197a0; --hielo:#def1f2;
  --ok:#1f7a4d; --ok-bg:#e1f2e9; --warn:#6b4300; --warn-bg:#f8ecd2; --err:#8c1d17; --err-bg:#f7dedc;
  --btn:#00607c; --btn-ink:#ffffff;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#04171d; --band:#0a2a34; --card:#0a2a34; --ink:#eaf6f9; --ink2:#a9c9d2; --title:#a6d9f4; --line:#1d4a57; --focus:#a6d9f4;
    --hielo:#0f3b47; --ok:#7fd8aa; --ok-bg:#12382a; --warn:#f0c46e; --warn-bg:#3d2f12; --err:#ff9d94; --err-bg:#451b18;
    --btn:#2ea5b0; --btn-ink:#04171d;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.92em}
.hero{background:linear-gradient(90deg,#003848 6%,#137b84 66%);background-color:#137b84;color:#fff}
.hero .in{max-width:1280px;margin:0 auto;padding:18px 20px 0;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
.hero h1{margin:0;font:800 26px/1.1 var(--sans);letter-spacing:-.02em}
.hero p{margin:2px 0 14px;color:#fff;opacity:.92;max-width:62ch}
.destino{margin-bottom:14px;font-size:13px;background:rgba(255,255,255,.14);border-radius:8px;padding:6px 10px}
nav.tabs{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;color:#fff;opacity:.85;padding:10px 14px;border-radius:8px 8px 0 0;font-weight:600}
nav.tabs button[aria-current="page"]{background:var(--bg);color:var(--title);opacity:1}
nav.tabs .n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.22);font-size:12px;text-align:center}
nav.tabs button[aria-current="page"] .n{background:var(--hielo);color:var(--title)}
main{max-width:1280px;margin:0 auto;padding:22px 20px 80px}
h2{margin:0 0 6px;font:800 24px/1.15 var(--sans);letter-spacing:-.015em;color:var(--title)}
h3{margin:22px 0 8px;font:700 16px/1.2 var(--sans)}
.lead{margin:0 0 16px;color:var(--ink2);max-width:72ch}
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.sec{background:transparent;color:var(--title);border-color:var(--title)}
.btn.mini{padding:4px 10px;font-size:13px;border-radius:6px}
.btn.peligro{background:transparent;color:var(--err);border-color:var(--err)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card .num{font:800 34px/1 var(--sans);color:var(--title)}
.card .et{color:var(--ink2);font-size:13px;margin-top:4px}
.banda{background:var(--band);border-radius:12px;padding:14px 16px;margin:16px 0}
.fila{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.sp{flex:1}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.chip.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:600}
.chip.err{background:var(--err-bg);border-color:var(--err);color:var(--err);font-weight:600}
.chip.info{background:var(--hielo);border-color:var(--petroleo);color:var(--title);font-weight:600}
.layout{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:start}
aside.fil{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;padding-right:6px}
fieldset{border:0;border-top:1px solid var(--line);margin:0 0 12px;padding:8px 0 0}
legend{font-weight:700;padding:0 8px 0 0;font-size:14px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:2px 0;font-size:14px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--petroleo)}
.opt .c{margin-left:auto;color:var(--ink2);font-variant-numeric:tabular-nums}
.opt.cero{opacity:.45}
input[type=search],input[type=text],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input[type=search]{flex:1 1 260px;min-width:0}
textarea{width:100%;min-height:60px;resize:vertical}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.item.inst{border-left:5px solid var(--ok)}
.item.act{border-left:5px solid var(--turquesa)}
.item.mod{border-left:5px solid var(--warn)}
.item.ret{opacity:.6}
.ih{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;padding:12px 14px 8px;align-items:start}
.ih .sel{margin-top:5px;accent-color:var(--petroleo)}
.nm{background:none;border:0;padding:0;text-align:left;font:700 16px/1.3 var(--sans);overflow-wrap:anywhere}
.rp{color:var(--ink2);font-size:13px;margin-left:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ds{margin:0;padding:0 14px 12px 42px;max-width:96ch}
.acc{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.det{border-top:1px solid var(--line);background:var(--band);padding:12px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.det h4{margin:0 0 4px;font-size:13px;color:var(--ink2);font-weight:600}
.det p{margin:0;overflow-wrap:anywhere}.det .full{grid-column:1/-1}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--ink2);font-size:13px}
.vacio{padding:28px 16px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:12px}
.aviso{border-radius:10px;padding:10px 14px;margin:0 0 14px}
.aviso.err{background:var(--err-bg);color:var(--err)}.aviso.warn{background:var(--warn-bg);color:var(--warn)}.aviso.ok{background:var(--ok-bg);color:var(--ok)}.aviso.info{background:var(--hielo);color:var(--title)}
.barra{height:8px;background:var(--band);border-radius:99px;overflow:hidden;margin-top:6px}.barra i{display:block;height:100%;background:var(--turquesa)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);max-width:min(860px,94vw);width:100%;padding:0}
dialog::backdrop{background:rgba(0,24,32,.55)}
.dlg-h{padding:16px 20px 8px}.dlg-b{padding:0 20px 8px;max-height:60vh;overflow:auto}.dlg-f{padding:12px 20px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.hall{border-left:4px solid var(--line);padding:4px 10px;margin:6px 0;background:var(--band);border-radius:0 8px 8px 0}
.hall.alto{border-left-color:var(--err)}.hall.medio{border-left-color:var(--warn)}
.hall code{display:block;color:var(--ink2);overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--abismo);color:#fff;padding:10px 16px;border-radius:10px;max-width:90vw;display:none;z-index:9}
#fbtn{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  aside.fil{position:static;max-height:none;display:none}aside.fil.abierto{display:block}
  #fbtn{display:inline-block}
  .ih{grid-template-columns:auto 1fr}.acc{grid-column:1/-1;justify-content:flex-start}
  .ds{padding-left:14px}.det{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="hero">
  <div class="in">
    <div>
      <h1>SkillHub</h1>
      <p>Catálogo, instalación y actualización de las skills de tus repositorios de GitHub.</p>
    </div>
    <div class="destino" id="destino"></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
</header>
<main id="main" tabindex="-1"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const ALC = {en:'En alcance', soporte:'Apoyo', fuera:'Fuera de alcance'};
const EST = {no_instalada:'No instalada', instalada:'Instalada', actualizable:'Actualización disponible', modificada:'Modificada localmente'};
const MARCA = {'':'Sin revisar', evaluar:'Evaluar', instalar:'Instalar', descartar:'Descartar'};

async function api(ruta, cuerpo) {
  const op = {headers: {'X-Token': TOKEN}};
  if (cuerpo !== undefined) { op.method = 'POST'; op.headers['Content-Type'] = 'application/json'; op.body = JSON.stringify(cuerpo); }
  let r;
  try { r = await fetch(ruta, op); } catch (e) { throw new Error('No hay conexión con SkillHub. ¿Sigue abierto el programa?'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || ('Error ' + r.status)); e.tipo = j.tipo; throw e; }
  return j;
}
function toast(msg, ms = 4200) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', ms); }

let D = null;            // vista del catálogo
let vista = 'panel';
const F = {q:'', repos:new Set(), cats:new Set(), alcs:new Set(), ests:new Set(), marcas:new Set(), sinDup:true, orden:'nombre'};
const abiertos = new Set(), selec = new Set();

async function cargar() { D = await api('/api/catalogo'); }
async function refrescar() { await cargar(); pintar(); }

function pintar() {
  const it = D.items, n = {inst: it.filter(i => i.estado !== 'no_instalada').length, act: it.filter(i => i.estado === 'actualizable').length,
    nuevas: it.filter(i => i.cambio === 'nueva').length};
  const tabs = [['panel','Panel',''], ['catalogo','Catálogo', it.filter(i => !i.dup).length], ['instaladas','Instaladas', n.inst],
    ['novedades','Novedades', n.act + n.nuevas + it.filter(i => i.cambio === 'modificada' || i.cambio === 'retirada').length || ''], ['perfiles','Perfiles', D.perfiles.length],
    ['fuentes','Fuentes', D.fuentes.length], ['registro','Registro',''], ['ajustes','Ajustes','']];
  $('#tabs').innerHTML = tabs.map(([k, t, c]) => `<button data-v="${k}" ${vista === k ? 'aria-current="page"' : ''}>${t}${c !== '' ? `<span class="n">${c}</span>` : ''}</button>`).join('');
  $('#destino').innerHTML = 'Destino de instalación: <code>' + esc(D.config.destino) + '</code>';
  const f = {panel:vPanel, catalogo:vCatalogo, instaladas:vInstaladas, novedades:vNovedades, perfiles:vPerfiles, fuentes:vFuentes, registro:vRegistro, ajustes:vAjustes}[vista];
  Promise.resolve(f()).catch(e => { $('#main').innerHTML = `<div class="aviso err">${esc(e.message)}</div>`; });
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) { vista = b.dataset.v; pintar(); window.scrollTo(0, 0); } });

/* ─────────── tareas ─────────── */
async function correrTarea(titulo, ruta, cuerpo) {
  const dlg = $('#dlg');
  dlg.innerHTML = `<div class="dlg-h"><h2>${esc(titulo)}</h2></div><div class="dlg-b"><div class="barra"><i style="width:2%"></i></div><p id="tmsg" class="lead">Iniciando…</p></div>`;
  if (!dlg.open) dlg.showModal();
  let r;
  try { r = await api(ruta, cuerpo); } catch (e) { dlg.close(); toast(e.message, 7000); return null; }
  for (;;) {
    await new Promise(ok => setTimeout(ok, 500));
    const t = await api('/api/tareas/' + r.tarea);
    const pct = t.total ? Math.round(100 * t.hecho / t.total) : 8;
    dlg.querySelector('.barra i').style.width = Math.max(pct, 4) + '%';
    dlg.querySelector('#tmsg').textContent = t.mensajes[t.mensajes.length - 1] || '…';
    if (t.estado !== 'en_curso') { dlg.close(); await refrescar(); return t; }
  }
}
function resumenLote(t, verbo) {
  if (!t) return;
  if (t.error) return toast(t.error, 8000);
  const ok = t.resultado.ok.length, er = t.resultado.errores;
  if (!er.length) return toast(`${verbo}: ${ok} skill(s).`);
  const conf = er.filter(e => e.tipo === 'RequiereConfirmacion');
  const dlg = $('#dlg');
  dlg.innerHTML = `<div class="dlg-h"><h2>${verbo}: ${ok} correctas, ${er.length} con avisos</h2></div><div class="dlg-b">${er.map(e => `<div class="hall ${e.tipo === 'RequiereConfirmacion' ? 'medio' : 'alto'}"><b>${esc(e.id.split('|').pop())}</b> (${esc(e.id.split('|')[0])})<code>${esc(e.error)}</code></div>`).join('')}</div>
    <div class="dlg-f">${conf.length ? '<button class="btn sec" id="rev-todas">Revisar las que piden confirmación</button>' : ''}<button class="btn" id="cerrar">Cerrar</button></div>`;
  dlg.showModal();
  $('#cerrar').onclick = () => dlg.close();
  if (conf.length) $('#rev-todas').onclick = () => { dlg.close(); revisarYConfirmar(conf.map(e => e.id), verbo.toLowerCase().startsWith('actual') ? '/api/actualizar' : '/api/instalar'); };
}
async function revisarYConfirmar(ids, ruta) {
  const dlg = $('#dlg');
  dlg.innerHTML = '<div class="dlg-h"><h2>Revisando archivos…</h2></div><div class="dlg-b"><p class="lead">Descargando y verificando contra el SHA de git.</p></div>';
  if (!dlg.open) dlg.showModal();
  const revs = [];
  for (const id of ids) {
    try { revs.push(await api('/api/revisar', {id})); } catch (e) { revs.push({id, name: id.split('|').pop(), nivel: 'error', error: e.message, hallazgos: []}); }
  }
  if (revs.length && revs.every(r => r.nivel === 'bajo')) { dlg.close(); resumenLote(await correrTarea(ruta === '/api/actualizar' ? 'Actualizando' : 'Instalando', ruta, {ids: revs.map(r => r.id)}), ruta === '/api/actualizar' ? 'Actualizadas' : 'Instaladas'); return; }
  const nivelTxt = {bajo:'Riesgo bajo', medio:'Riesgo medio', alto:'Riesgo alto', error:'No se pudo revisar'};
  const cls = {bajo:'ok', medio:'warn', alto:'err', error:'err'};
  dlg.innerHTML = `<div class="dlg-h"><h2>Revisión previa a la instalación</h2><p class="lead">Son señales automáticas por patrones, no un veredicto: abre los archivos en GitHub si tienes dudas.</p></div>
    <div class="dlg-b">${revs.map(r => `<h3>${esc(r.name)} <span class="chip ${cls[r.nivel]}">${nivelTxt[r.nivel]}</span></h3>
      ${r.error ? `<div class="aviso err">${esc(r.error)}</div>` : `<p class="lead">${r.archivos} archivos · ${r.scripts.length} scripts · ${r.binarios.length} binarios · ${r.total_hallazgos} señales</p>` +
        r.hallazgos.slice(0, 12).map(h => `<div class="hall ${h.nivel}"><b>${esc(h.regla)}</b> — ${esc(h.archivo)}${h.linea ? ':' + h.linea : ''}<code>${esc(h.texto)}</code></div>`).join('')}`).join('')}</div>
    <div class="dlg-f"><label class="opt"><input type="checkbox" id="oka"> He leído las señales y acepto instalar</label><button class="btn sec" id="no">Cancelar</button><button class="btn" id="si" disabled>Instalar confirmadas</button></div>`;
  $('#oka').onchange = e => $('#si').disabled = !e.target.checked;
  $('#no').onclick = () => dlg.close();
  $('#si').onclick = async () => { dlg.close(); const ok = revs.filter(r => r.nivel !== 'error').map(r => r.id); resumenLote(await correrTarea('Instalando', ruta, {ids: ok, confirmadas: ok}), 'Instaladas'); };
}
async function accionLote(accion, ids, extra = {}) {
  const ruta = '/api/' + accion, verbo = {instalar:'Instaladas', actualizar:'Actualizadas', desinstalar:'Desinstaladas'}[accion];
  resumenLote(await correrTarea({instalar:'Instalando', actualizar:'Actualizando', desinstalar:'Desinstalando'}[accion], ruta, {ids, ...extra}), verbo);
}
async function sincronizar(repos) {
  const t = await correrTarea('Sincronizando con GitHub', '/api/sync', {repos: repos || []});
  if (!t) return;
  if (t.error) return toast(t.error, 8000);
  const r = t.resultado, errs = Object.entries(r.fuentes).filter(([, v]) => v.error);
  toast(`Nuevas ${r.nuevas} · modificadas ${r.modificadas} · retiradas ${r.retiradas}` + (errs.length ? ` · ${errs.length} fuente(s) con error (ver Fuentes)` : ''), 7000);
}

/* ─────────── Panel ─────────── */
function vPanel() {
  const it = D.items, c = k => it.filter(i => !i.dup && i.estado === k).length;
  const act = c('actualizable'), mod = c('modificada'), inst = it.filter(i => i.estado !== 'no_instalada').length;
  const choques = it.filter(i => i.choque && i.estado === 'no_instalada' && i.marca === 'instalar');
  const ult = D.fuentes.map(f => f.sincronizado).filter(Boolean).sort().pop();
  const errs = D.fuentes.filter(f => f.estado === 'error');
  const porMarca = k => it.filter(i => i.marca === k && i.estado === 'no_instalada').length;
  $('#main').innerHTML = `
    <h2>Panel</h2><p class="lead">Estado de tu biblioteca de skills. Todo se instala en la carpeta de destino de arriba; lo reemplazado va a una papelera recuperable.</p>
    ${errs.length ? `<div class="aviso err"><b>${errs.length} fuente(s) con error</b> en la última sincronización: ${errs.map(f => esc(f.repo)).join(', ')}. Detalle en Fuentes.</div>` : ''}
    <div class="grid">
      <div class="card"><div class="num">${it.filter(i => !i.dup).length}</div><div class="et">skills en el catálogo (sin copias)</div></div>
      <div class="card"><div class="num">${inst}</div><div class="et">instaladas por SkillHub</div></div>
      <div class="card"><div class="num">${act}</div><div class="et">con actualización disponible</div></div>
      <div class="card"><div class="num">${it.filter(i => i.cambio === 'nueva').length}</div><div class="et">nuevas desde la última sincronización</div></div>
    </div>
    <div class="banda fila"><span>Última sincronización: <b>${ult ? new Date(ult).toLocaleString('es-CO') : 'nunca'}</b></span><span class="sp"></span>
      <button class="btn" id="b-sync">Sincronizar ahora</button>
      <button class="btn sec" id="b-act" ${act ? '' : 'disabled'}>Actualizar las ${act} disponibles</button></div>
    <h3>Requieren tu atención</h3>
    ${mod || choques.length || porMarca('instalar') ? '' : '<div class="vacio">Nada pendiente.</div>'}
    ${mod ? `<div class="aviso warn">${mod} skill(s) instaladas tienen cambios locales; actualizarlas los descartaría (quedan en la papelera).</div>` : ''}
    ${choques.length ? `<div class="aviso warn">${choques.length} skill(s) marcadas «Instalar» chocan con una carpeta existente del mismo nombre: ${choques.slice(0, 6).map(i => esc(i.name)).join(', ')}.</div>` : ''}
    ${porMarca('instalar') ? `<div class="aviso info">${porMarca('instalar')} skill(s) marcadas «Instalar» siguen sin instalar. <button class="link" id="b-inst-marc" style="background:none;border:0;color:var(--title);text-decoration:underline;font-weight:700">Instalarlas ahora</button></div>` : ''}
    ${D.externas.length ? `<p class="lead">En el destino hay ${D.externas.length} carpeta(s) con skills que SkillHub no gestiona (${D.externas.slice(0, 8).map(e => esc(e.carpeta)).join(', ')}). No las toca.</p>` : ''}`;
  $('#b-sync').onclick = () => sincronizar();
  $('#b-act').onclick = async () => resumenLote(await correrTarea('Actualizando', '/api/actualizar-todas', {}), 'Actualizadas');
  const bm = $('#b-inst-marc'); if (bm) bm.onclick = () => accionLote('instalar', it.filter(i => i.marca === 'instalar' && i.estado === 'no_instalada' && !i.choque).map(i => i.id));
}

/* ─────────── Catálogo ─────────── */
function pasa(i, skip) {
  if (F.sinDup && i.dup) return false;
  if (skip !== 'repos' && F.repos.size && !F.repos.has(i.repo)) return false;
  if (skip !== 'cats' && F.cats.size && !F.cats.has(i.cat)) return false;
  if (skip !== 'alcs' && F.alcs.size && !F.alcs.has(i.alc)) return false;

/* ─────────── Registro y Ajustes ─────────── */
async function vRegistro() {
  const r = await api('/api/registro');
  $('#main').innerHTML = `<h2>Registro</h2><p class="lead">Últimas operaciones (más recientes primero). No contiene credenciales.</p>
    ${r.lineas.length ? `<div style="overflow:auto"><table><thead><tr><th>Hora</th><th>Evento</th><th>Detalle</th></tr></thead><tbody>${r.lineas.map(l => `<tr><td class="mono">${new Date(l.ts).toLocaleString('es-CO')}</td><td><span class="chip ${/error/.test(l.evento) ? 'err' : ''}">${esc(l.evento)}</span></td><td class="mono">${esc(JSON.stringify(Object.fromEntries(Object.entries(l).filter(([k]) => k !== 'ts' && k !== 'evento'))))}</td></tr>`).join('')}</tbody></table></div>` : '<div class="vacio">Sin operaciones registradas.</div>'}`;
}
function vAjustes() {
  $('#main').innerHTML = `<h2>Ajustes</h2>
    <h3>Carpeta de destino</h3><p class="lead">Dónde se instalan las skills. Por defecto, la carpeta de skills personales de Claude Code. Para un proyecto concreto usa la carpeta <code>.claude/skills</code> de ese proyecto (ruta absoluta).</p>
    <div class="fila"><input type="text" id="dest" value="${esc(D.config.destino)}" style="min-width:min(520px,90vw)" aria-label="Carpeta de destino"><button class="btn" id="gd">Guardar destino</button></div>
    <h3>Cargar en claude.ai (manual)</h3><p class="lead">claude.ai no lee carpetas locales. Usa «Exportar .zip» en cada skill o perfil y cárgalo desde los ajustes de capacidades de claude.ai. La ruta exacta del menú la confirma la documentación vigente de Anthropic; no la verifiqué hoy.</p>
    <h3>Datos locales</h3><p class="lead">Todo vive en la carpeta de datos de SkillHub (catálogo, tus marcas, perfiles, registro y papelera). Para recuperar algo desinstalado o reemplazado, copia su carpeta desde <code>papelera</code> al destino.</p>
    <h3>Acerca de</h3><p class="lead">SkillHub ${esc(D.version)} · catálogo generado ${D.generado ? new Date(D.generado).toLocaleString('es-CO') : '—'}.</p>`;
  $('#gd').onclick = async () => { try { await api('/api/config', {destino: $('#dest').value}); await refrescar(); toast('Destino guardado.'); } catch (e) { toast(e.message, 7000); } };
}

cargar().then(pintar).catch(e => { $('#main').innerHTML = `<div class="aviso err">${esc(e.message)} Abre SkillHub con el enlace que imprime el programa en la consola.</div>`; });
</script>
</body>
</html>
